name: firmware

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Make and test the changes, but upload the diff instead of opening a PR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # ratchet:astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - id: check
        run: uv run python .github/scripts/new_firmware.py >> "$GITHUB_OUTPUT"
      # An open or rejected PR for this version already exists; don't redo it every week.
      - id: branch
        if: steps.check.outputs.version
        run: |
          if git ls-remote --exit-code --heads origin "firmware/${{ steps.check.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      # A PR opened with GITHUB_TOKEN doesn't trigger the test workflow, so act as the app instead.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3
        if: steps.check.outputs.version && !steps.branch.outputs.exists
        id: app-token
        with:
          client-id: ${{ vars.FIRMWARE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIRMWARE_APP_PRIVATE_KEY }}
      - if: steps.app-token.outputs.token
        run: |
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # ratchet:anthropics/claude-code-action@v1
        if: steps.check.outputs.version && !steps.branch.outputs.exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Follow .github/prompts/firmware.md with $VERSION = ${{ steps.check.outputs.version }}.
            ${{ env.DRY_RUN == 'true' && 'Dry run: do not commit, push or open a PR. Write the PR title and body to pr.md instead.' || '' }}
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,Bash(curl:*),Bash(strings:*),Bash(diff:*),Bash(uv run:*),Bash(git:*),Bash(gh pr create:*)"
      - if: env.DRY_RUN == 'true' && steps.app-token.outputs.token
        run: git add -A && git diff --cached -- . ':!pr.md' > firmware.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        if: env.DRY_RUN == 'true' && steps.app-token.outputs.token
        with:
          name: firmware-dry-run
          path: |
            firmware.diff
            pr.md
