name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # ratchet:astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run python -m pytest

  # Stable name for the required branch-protection check.
  test:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.matrix.result }}" = success
