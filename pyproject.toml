[project]
name = "hapax-tui"
version = "0.1.0"
description = "Validate Squarp Hapax instrument definitions"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "lark>=1.3",
    "textual>=8.2",
]

[project.scripts]
hapax = "hapax.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hapax"]
